<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Review &amp; Openings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section class="board-col">
    <div class="player" id="player-top"></div>
    <div class="board-wrap">
      <div id="evalbar"><div id="evalbar-fill"></div><span id="evalbar-text"></span></div>
      <div id="board-box">
        <div id="board"></div>
        <svg id="arrows" viewBox="0 0 8 8"></svg>
      </div>
    </div>
    <div class="player" id="player-bottom"></div>
  </section>

  <aside class="panel">
    <header class="panel-head">
      <div class="tabs"><button class="tab on" data-mode="review">Review</button><button class="tab" data-mode="openings">Openings</button><button class="tab" data-mode="guess">Guess the Move</button></div>
      <button id="btn-new" class="ghost" hidden>New game</button>
    </header>

    <div id="view-load" class="view">
      <div class="card">
        <h2>Import your games</h2>
        <form id="form-user" class="row">
          <select id="site">
            <option value="chesscom">Chess.com</option>
            <option value="lichess">Lichess</option>
          </select>
          <input id="username" placeholder="Username" autocomplete="off" spellcheck="false">
          <button type="submit">Fetch</button>
        </form>
        <div id="games-status" class="muted"></div>
        <div id="games"></div>
      </div>
      <div class="card">
        <h2>Or paste a PGN</h2>
        <textarea id="pgn" placeholder="1. e4 e5 2. Nf3 ..." spellcheck="false"></textarea>
        <div class="row">
          <button id="btn-pgn">Review</button>
          <button id="btn-sample" class="ghost">Load sample game</button>
          <label class="depth">Depth
            <select id="depth">
              <option value="10">10 (fast)</option>
              <option value="12">12</option>
              <option value="14" selected>14</option>
              <option value="16">16</option>
              <option value="18">18 (slow)</option>
            </select>
          </label>
        </div>
        <div id="load-error" class="error"></div>
      </div>
    </div>

    <div id="view-review" class="view" hidden>
      <div id="progress-box" class="card">
        <div id="progress-label">Starting engine...</div>
        <div class="progress"><div id="progress-fill"></div></div>
      </div>
      <div id="summary" class="card" hidden></div>
      <div id="explore" class="card" hidden><div id="explore-line"></div><button id="btn-back" class="ghost">Back to game</button></div>
      <div id="coach" class="card"></div>
      <div id="lines" class="card"></div>
      <canvas id="graph" height="70"></canvas>
      <div id="opening" class="muted"></div>
      <div id="moves"></div>
      <div class="nav">
        <button data-nav="start" title="Start (Home)">&#x23EE;&#xFE0E;</button>
        <button data-nav="prev" title="Previous (Left)">&#x25C0;&#xFE0E;</button>
        <button data-nav="next" title="Next (Right)">&#x25B6;&#xFE0E;</button>
        <button data-nav="end" title="End (End)">&#x23ED;&#xFE0E;</button>
        <button data-nav="flip" title="Flip board (F)">&#x21C5;</button>
      </div>
    </div>

    <div id="view-openings" class="view" hidden>
      <div id="op-browse">
        <input id="op-search" placeholder="Search openings (e.g. Sicilian, London, C50)" autocomplete="off" spellcheck="false">
        <div id="op-status" class="muted"></div>
        <div id="op-list"></div>
      </div>
      <div id="op-detail" hidden></div>
    </div>

    <div id="view-guess" class="view" hidden>
      <label class="row" style="margin:0"><span class="muted">Positions from</span>
        <select id="g-source">
          <option value="rapid">Top players - rapid (Lichess)</option>
          <option value="blitz">Top players - blitz (Lichess)</option>
          <option value="classical">Top players - classical (Lichess)</option>
          <option value="mine">My games (username from Game Review tab)</option>
        </select>
      </label>
      <div id="g-body"></div>
    </div>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
